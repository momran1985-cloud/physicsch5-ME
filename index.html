<script>
'use strict';

const $=id=>document.getElementById(id);

const fmt=v=>{const n=Number(v);if(!isFinite(n)||n===0)return'0';const a=Math.abs(n);if(a>=1e5||a<1e-2)return n.toExponential(2).replace('e+','×10^').replace('e','×10^');return String(Number(n.toPrecision(4)))};
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};

 return {students:{},classes:{},current:null,settings:{pin:'1234',email:'momran1985@gmail.com',logo:'',openPost:false}}}

const DEFAULT_ROSTER={'ثاني ثانوي / شعبة 3':['حسين صادق علي المرعي','عبد الله محمد السحيب','علي حسين العبيدان','صادق حبيب بوعيد','عبد العزيز عبد الله الرشيدي','محمد حسن ناصر الحسن','حاكم فهد خليفة الملحم','نواف عبد الله العبد المحسن','علي عبد الله القطان','محمد صالح حسن القريني','حسين علي حسين الصالح','عبد الله جعفر حسن اليوسف','محمد عبد المنعم المبارك','عثمان محمد السيف','حسن علي أحمد الجبر','الياس أحمد الرمل','أحمد عماد المشعل','ميثم يوسف الراشد','علي عبد الوهاب العامر','علي ضياء المسبح','محمد قاسم المبارك','عبد اللطيف محمد المطوع','مرتضى علي الحجي','هادي محمد العباد','محمد انور الخواجة']};
function ensureRoster(){let ch=false;if(!DB.settings.seeded){Object.entries(DEFAULT_ROSTER).forEach(([cn,list])=>{const c=DB.classes[cn]||(DB.classes[cn]={students:[],groups:{}});list.forEach(n=>{if(!c.students.includes(n))c.students.push(n)})});DB.settings.seeded=true;ch=true}if(DB.settings.allowOther===undefined){DB.settings.allowOther=false;ch=true}if(ch)save()}
ensureRoster();
const an=s=>String(s||'').replace(/[\u064B-\u065F\u0640]/g,'').replace(/[أإآٱ]/g,'ا').replace(/ى/g,'ي').replace(/ة/g,'ه').replace(/\s+/g,' ').trim();
function findRoster(input){const t=an(input);if(!t)return null;const all=rosterNames();const ns=x=>an(x).replace(/ /g,'');const ex=all.filter(r=>ns(r.n)===ns(t));if(ex.length)return ex[0].n;const w=t.split(' ');if(w.length<2)return null;const m=all.filter(r=>{const rw=an(r.n).split(' ');return w.every(x=>rw.includes(x))});return m.length===1?m[0].n:null}
const me=()=>DB.students[DB.current];
const SKILLS=['s1','s2','s3','s4','s5','s6','s7'];
const LV={b:'مبتدئ',m:'متوسط',a:'متقدم'};
const S={view:'login',skill:null,tab:'learn',quiz:null,tAuth:false,tTab:'dash',fcls:'',streak:0,boardTab:'ind'};
function beep(){try{const c=new (window.AudioContext||window.webkitAudioContext)();const o=c.createOscillator();o.connect(c.destination);o.frequency.value=880;o.start();setTimeout(()=>{o.stop();c.close()},700)}catch(e){}}
function startTimer(min,label){clearInterval(S.tm);S.tleft=Math.round(min*60);S.tlabel=label||'';drawTimer();S.tm=setInterval(()=>{S.tleft--;drawTimer();if(S.tleft<=0){clearInterval(S.tm);beep();toast('⏰ انتهى الوقت')}},1000)}
function stopTimer(){clearInterval(S.tm);S.tleft=null;drawTimer()}
function drawTimer(){const el=$('timer');if(S.tleft==null||S.tleft<0){el.innerHTML='';return}const m=Math.floor(S.tleft/60),s=S.tleft%60;el.innerHTML=`<div class="tbox"><small>${esc(S.tlabel)}</small><b>${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}</b><button class="btn s r" onclick="stopTimer()">إيقاف</button></div>`}

/* ================== المحتوى: الأسئلة ================== */
const Q=(id,d,q,o,a,e,h)=>({id,d,q,o,a,e,h});
const PRE=[
Q('p1',1,'تتناسب الطاقة الحركية لجسم ما طردياً مع:',['كتلته ومربع سرعته','كتلته وسرعته فقط','ارتفاعه فقط','وزنه ومسافته'],0,'KE = ½mv² : طردية مع الكتلة ومع مربع السرعة.'),
Q('p2',1,'وحدة قياس الطاقة في النظام الدولي هي:',['الجول (J)','النيوتن (N)','الواط (W)','الباسكال (Pa)'],0,'الطاقة والشغل يقاسان بالجول، وJ = kg·m²/s².'),
Q('p3',1,'الطاقة الميكانيكية لنظام ما تساوي:',['KE + PE','KE − PE','KE × PE','KE ÷ PE'],0,'الطاقة الميكانيكية = مجموع الطاقة الحركية وطاقة الوضع الجاذبية.'),
Q('p4',2,'جسم كتلته 2 kg يتحرك بسرعة 3 m/s. طاقته الحركية:',['9 J','6 J','18 J','3 J'],0,'KE = ½ × 2 × 3² = 9 J.'),
Q('p5',2,'كتلة 1.0 kg على ارتفاع 10 m فوق الأرض (g = 9.8 m/s²). طاقة وضعها الجاذبية:',['98 J','10 J','9.8 J','980 J'],0,'PE = mgh = 1 × 9.8 × 10 = 98 J.'),
Q('p6',2,'ينص قانون حفظ الطاقة على أن مجموع الطاقة في النظام المغلق المعزول:',['يبقى ثابتاً وتتحول الطاقة من شكل لآخر','يزداد دائماً','يتناقص دائماً','يساوي صفراً'],0,'في النظام المغلق المعزول لا تفنى الطاقة ولا تستحدث بل تتحول.'),
Q('p7',3,'قُذفت كرة رأسياً إلى أعلى. عند أقصى ارتفاع تكون:',['KE = 0 وطاقة الوضع أكبر ما يمكن','KE أكبر ما يمكن وPE = 0','KE = PE دائماً','الطاقة الكلية صفراً'],0,'عند أقصى ارتفاع تتوقف الكرة لحظياً فتتحول طاقتها كلها إلى طاقة وضع.'),
Q('p8',3,'التحمت عربتان بعد التصادم (تصادم عديم المرونة). أي الكميتين محفوظة في النظام المعزول؟',['الزخم فقط','الطاقة الحركية فقط','الزخم والطاقة الحركية معاً','لا شيء منهما'],0,'الزخم محفوظ دائماً في النظام المعزول، أما الطاقة الحركية فيتحول جزء منها إلى حرارة وصوت.')
];
const SK={
s1:{n:'نظرية الشغل – الطاقة',icon:'⚖️',col:'#0b5ed7',
goals:['أربط بين الشغل المبذول والتغير في طاقة النظام.','أستخدم العلاقة KE قبل + W = KE بعد لحل المسائل.','أمثّل الشغل والطاقة بالأعمدة البيانية.'],
learn:`<p>عندما يُبذل شغل على نظام تزداد طاقته، وعندما يبذل النظام شغلاً تقل طاقته؛ أي أن <b>الشغل ينقل الطاقة بين النظام والمحيط الخارجي</b>. وتتبّع الطاقة يشبه تتبّع المال: (الرصيد قبل) + (التدفق) = (الرصيد بعد).</p>
<div class="formula">W = F·d &nbsp;&nbsp;|&nbsp;&nbsp; KE<sub>قبل</sub> + W = KE<sub>بعد</sub></div>
<ul class="l"><li>القوة والإزاحة في الاتجاه نفسه ⟵ شغل <b>موجب</b> ⟵ تزداد الطاقة الحركية (قذف الكرة).</li><li>القوة عكس اتجاه الحركة ⟵ شغل <b>سالب</b> ⟵ تقل الطاقة الحركية (التقاط الكرة، الاحتكاك).</li><li>الطاقة الحركية موجبة دائماً أما الشغل فقد يكون موجباً أو سالباً.</li></ul>

vids:[{t:'الشغل والطاقة الحركية (شرح بالعربية)',q:'نظرية الشغل والطاقة الحركية شرح فيزياء ثانوي'},{t:'Work-Energy Theorem (Khan Academy)',q:'work energy theorem khan academy'}],
phet:[{n:'مضمار الطاقة للتزلج (Energy Skate Park)',s:'energy-skate-park'}],
lab:{steps:['افتح المحاكاة واختر تبويب «الاحتكاك» وفعّل مخطط الأعمدة.','اجعل المتزلج يهبط ثم يصعد وراقب أعمدة KE وPE والطاقة الحرارية.','زد الاحتكاك وسجّل: ماذا يحدث للارتفاع الذي يصل إليه المتزلج؟','فسّر ذلك بدلالة الشغل السالب الذي يبذله الاحتكاك.'],qs:['اكتب علاقة تربط الشغل بالتغير في الطاقة الحركية.','متى يكون شغل الاحتكاك سالباً؟']},
acts:{
 hook:{t:'اقذف والتقط (تهيئة)',min:4,mat:'كرة صغيرة وكرسي بعجلات (اختياري)',steps:['يدفع طالب كرسياً بعجلات بقوة ثابتة مسافة 2 م ثم يتوقف عن الدفع.','اسأل: ماذا بذل الطالب؟ وماذا حدث لحركة الكرسي؟','اربط الإجابات بنموذج المال: الشغل = تدفق طاقة داخل النظام أو خارجه.'],q:'هل يبذل الطالب الذي يلتقط الكرة شغلاً موجباً أم سالباً على الكرة؟ ولماذا؟'},

Q('s1q1',1,'قوة ثابتة 20 N أثّرت في جسم فتحرك 5 m في اتجاه القوة. الشغل المبذول:',['100 J','25 J','4 J','15 J'],0,'W = F·d = 20 × 5 = 100 J (موجب لأن القوة والإزاحة في الاتجاه نفسه).','اضرب القوة في المسافة.'),
Q('s1q2',1,'تنص نظرية الشغل – الطاقة على أن الشغل المبذول على جسم يساوي:',['التغير في طاقته الحركية','ضعف سرعته','كتلته × تسارعه فقط','طاقة وضعه'],0,'W = ΔKE = KE بعد − KE قبل.','الشغل ينقل الطاقة.'),
Q('s1q3',2,'متزلج كتلته 52.0 kg يتحرك بسرعة 2.5 m/s ويتوقف بفعل الاحتكاك. شغل الاحتكاك تقريباً:',['−163 J','+163 J','−325 J','−26 J'],0,'KE = ½×52×2.5² = 162.5 J. الاحتكاك يُنقص الطاقة فشغله سالب: W = 0 − 162.5 ≈ −163 J.','احسب KE الابتدائية أولاً.'),

Q('s1q5',3,'سيارة كتلتها 1000 kg زادت سرعتها من 10 m/s إلى 20 m/s. الشغل المبذول عليها:',['150 000 J','50 000 J','100 000 J','300 000 J'],0,'W = ½×1000×(20² − 10²) = 500 × 300 = 150 000 J. (لاحظ: ليس ½m(Δv)²).','W = KEf − KEi.'),

s2:{n:'الطاقة الحركية',icon:'🏃',col:'#12a150',
goals:['أحسب الطاقة الحركية لجسم متحرك.','أفسر اعتماد KE على الكتلة ومربع السرعة.','أميّز الطاقة الحركية الخطية من الدورانية.'],
learn:`<p>الطاقة الحركية هي الطاقة التي يمتلكها الجسم بسبب حركته.</p>
<div class="formula">KE = ½ m v²</div>
<ul class="l"><li>تتناسب <b>طردياً مع الكتلة</b>: كرة حديد 7.26 kg لها طاقة أكبر بنحو 49 مرة من كرة بيسبول 0.148 kg بالسرعة نفسها.</li><li>تتناسب <b>طردياً مع مربع السرعة</b>: سيارة بسرعة 20 m/s لها أربعة أضعاف طاقة سيارة مماثلة بسرعة 10 m/s.</li><li><b>الطاقة الحركية الدورانية</b>: للأجسام الدوّارة (البلبل، الغطاس وهو يدور) وتعتمد على السرعة الزاوية ω وعلى توزيع الكتلة وليس الكتلة فقط.</li></ul>
<div class="ex"><b>مثال:</b> سيارة 875.0 kg بسرعة 22.0 m/s: KE = ½×875×22² ≈ 2.12×10⁵ J.</div>`,
vids:[{t:'الطاقة الحركية',q:'الطاقة الحركية شرح فيزياء ثانوي KE = 1/2 mv2'},{t:'Kinetic Energy explained',q:'kinetic energy physics explained'}],

 enrich:{t:'سباق الأسطوانات (إثراء)',min:10,mat:'علبة معدنية مصمتة وأخرى مجوفة بالكتلة نفسها تقريباً، لوح مائل',steps:['اترك العلبتين تتدحرجان معاً من قمة اللوح.','سجّل أيهما تصل أولاً.','فسّر: الطاقة الحركية تتوزع بين خطية ودورانية، وتعتمد الدورانية على توزيع الكتلة.'],q:'كيف يؤثر توزيع الكتلة في الطاقة الحركية الدورانية؟'},

qs:[
Q('s2q1',1,'عند مضاعفة سرعة جسم مع بقاء كتلته ثابتة، فإن طاقته الحركية:',['تتضاعف أربع مرات','تتضاعف مرتين','تبقى ثابتة','تقل للنصف'],0,'KE ∝ v² فمضاعفة السرعة تعطي (2)² = 4 أضعاف.','السرعة مربّعة في القانون.'),
Q('s2q2',1,'أي العلاقات الآتية تعبر عن الطاقة الحركية؟',['½mv²','mgh','Fd/t','mv'],0,'KE = ½ m v². أما mgh فهي طاقة الوضع وmv هو الزخم.',''),
Q('s2q3',2,'سيارة كتلتها 875.0 kg تتحرك بسرعة 22.0 m/s. طاقتها الحركية:',['2.12×10⁵ J','4.23×10⁵ J','9.63×10³ J','1.93×10⁴ J'],0,'KE = ½×875×22² = 437.5 × 484 ≈ 2.12×10⁵ J.','ربّع السرعة قبل الضرب.'),
Q('s2q4',2,'كرة حديدية كتلتها 7.26 kg وكرة بيسبول كتلتها 0.148 kg بالسرعة نفسها. نسبة طاقتيهما الحركيتين تقريباً:',['49 : 1','7 : 1','2 : 1','2401 : 1'],0,'السرعة متساوية فالنسبة = نسبة الكتل = 7.26 ÷ 0.148 ≈ 49.','السرعتان متساويتان فتُحذفان.'),
Q('s2q5',2,'تعتمد الطاقة الحركية الدورانية لجسم على:',['السرعة الزاوية وتوزيع الكتلة','الارتفاع فقط','الكتلة فقط','الزمن فقط'],0,'الطاقة الحركية الدورانية ترتبط بالسرعة الزاوية ω وبتوزيع الكتلة حول محور الدوران.',''),
Q('s2q6',3,'جسم كتلته 2 kg طاقته الحركية 25 J. سرعته:',['5 m/s','12.5 m/s','25 m/s','3.5 m/s'],0,'v = √(2KE/m) = √(50/2) = √25 = 5 m/s.','v = √(2KE ÷ m).'),
Q('s2q7',3,'مذنّب كتلته 7.85×10¹¹ kg يتحرك بسرعة 25.0 km/s. طاقته الحركية تقريباً:',['2.45×10²⁰ J','4.91×10²⁰ J','9.8×10¹⁵ J','2.45×10¹⁷ J'],0,'v = 25 000 m/s. KE = ½ × 7.85×10¹¹ × (2.5×10⁴)² ≈ 2.45×10²⁰ J.','حوّل km/s إلى m/s أولاً.')]},
s3:{n:'طاقة الوضع الجاذبية',icon:'🏔️',col:'#0891b2',
goals:['أحسب طاقة الوضع الجاذبية لجسم بالنسبة لمستوى إسناد.','أختار مستوى الإسناد المناسب وأفسّر الإشارة السالبة.','أحسب شغل قوة الجاذبية عند الرفع والسقوط.'],
learn:`<p>الجسم المرفوع بعيداً عن الأرض يختزن طاقة نتيجة قوة التجاذب بينه وبين الأرض تسمى <b>طاقة الوضع الجاذبية</b>.</p>
<div class="formula">PE = m g h</div>
<ul class="l"><li>h: الارتفاع الرأسي عن <b>مستوى الإسناد</b> وهو المستوى الذي نعدّ عنده PE = 0، ونختاره نحن حسب سهولة الحل.</li><li>تكون PE سالبة إذا كان الجسم تحت مستوى الإسناد.</li><li>شغل الجاذبية عند الصعود: W = −mgh (سالب) وعند الهبوط: W = +mgh (موجب).</li><li>ما يهم فعلياً هو <b>التغير</b> في طاقة الوضع وليس قيمتها المطلقة.</li></ul>
<div class="ex"><b>مثال (بولنج):</b> كرة 7.30 kg على كتفك ارتفاعه 1.12 m عن الأرض: PE = 7.30×9.80×1.12 ≈ 80.1 J. وبالنسبة لسلة الكرات (ارتفاعها 0.610 m): h = 0.51 m ⟵ PE ≈ 36.5 J، وشغل الجاذبية = −36.5 J.</div>`,
vids:[{t:'طاقة الوضع الجاذبية',q:'طاقة الوضع الجاذبية شرح mgh مستوى الإسناد'},{t:'Gravitational Potential Energy',q:'gravitational potential energy khan academy'}],

qs:[
Q('s3q1',1,'تعتمد طاقة الوضع الجاذبية لجسم على:',['كتلته وارتفاعه عن مستوى الإسناد','سرعته فقط','حجمه فقط','لونه'],0,'PE = mgh تعتمد على الكتلة وg والارتفاع h.',''),
Q('s3q2',1,'مستوى الإسناد هو المستوى الذي تكون عنده:',['طاقة الوضع = صفراً','الطاقة الحركية = صفراً','السرعة = صفراً','الكتلة = صفراً'],0,'نختار مستوى الإسناد ونعدّ طاقة الوضع عنده صفراً.',''),
Q('s3q3',2,'كرة بولنج كتلتها 7.30 kg على ارتفاع 1.12 m عن سطح الأرض. طاقة وضعها بالنسبة للأرض:',['80.1 J','36.5 J','8.17 J','71.5 J'],0,'PE = 7.30 × 9.80 × 1.12 ≈ 80.1 J.','PE = mgh.'),
Q('s3q4',2,'الكرة نفسها (7.30 kg) على الكتف 1.12 m، وسلة الكرات ارتفاعها 0.610 m. طاقة وضعها بالنسبة للسلة:',['36.5 J','80.1 J','43.6 J','0 J'],0,'h = 1.12 − 0.610 = 0.51 m ⟵ PE = 7.30×9.80×0.51 ≈ 36.5 J.','احسب h بالنسبة للسلة أولاً.'),
Q('s3q5',2,'شغل قوة الجاذبية على كرة ترتفع من السلة إلى الكتف (الحالة السابقة):',['−36.5 J','+36.5 J','−80.1 J','صفر'],0,'الوزن لأسفل والحركة لأعلى فالشغل سالب: W = −mgh = −36.5 J.','قارن اتجاه الوزن باتجاه الإزاحة.'),
Q('s3q6',3,'سقطت قطعة طوب كتلتها 1.8 kg من مدخنة ارتفاعها 6.7 m إلى الأرض. التغير في طاقة وضعها:',['−118 J','+118 J','−12 J','−18 J'],0,'ΔPE = mg(hf − hi) = 1.8×9.8×(0 − 6.7) ≈ −118 J (تنقص).','النقصان يعني إشارة سالبة.'),
Q('s3q7',3,'قذيفة كتلتها 25.0 kg على ارتفاع 425 m ثم وصلت إلى 225 m. التغير في طاقة وضعها:',['−4.9×10⁴ J','+4.9×10⁴ J','−1.04×10⁵ J','−2.2×10⁴ J'],0,'ΔPE = 25.0×9.8×(225 − 425) = −49 000 J = −4.9×10⁴ J.','الفرق في الارتفاع = −200 m.')]},
s4:{n:'طاقة الوضع المرونية والطاقة السكونية',icon:'🏹',col:'#d97706',
goals:['أصف كيف تُخزَّن طاقة الوضع المرونية في النوابض والأجسام المرنة.','أتتبع تحولات الطاقة في القوس والزانة.','أستخدم E₀ = mc² لتفسير الطاقة السكونية.'],
learn:`<p>تختزن <b>طاقة الوضع المرونية</b> في الجسم عند تغيير شكله (شدّ نابض، ثني زانة، شدّ وتر قوس). وعند تحرّره تتحول طاقته إلى طاقة حركية.</p>
<ul class="l"><li>القوس: بسحب الوتر يُبذل شغل فتخزّن الطاقة، وعند الإفلات تنتقل الطاقة إلى السهم كطاقة حركية.</li><li>القفز بالزانة: طاقة حركية ⟵ طاقة وضع مرونية ⟵ طاقة وضع جاذبية وحركية.</li><li>قضبان الألياف الزجاجية تخزن طاقة مرونية أكثر من المعدنية فيقفز اللاعب أعلى.</li></ul>
<p><b>الطاقة السكونية (أينشتاين):</b> الكتلة نفسها شكل من أشكال الطاقة.</p>
<div class="formula">E₀ = m c² &nbsp;&nbsp; (c = 3×10⁸ m/s)</div>
<div class="tip">تغير كتلة نابض مضغوط صغير جداً فلا يُكتشف، أما في القوى النووية فالتغير في الكتلة كبير والطاقة المتحررة هائلة.</div>`,

learn:`<p>تسمى مجموع الطاقة الحركية وطاقة الوضع الجاذبية <b>الطاقة الميكانيكية</b>. في النظام <b>المغلق المعزول</b> (لا تدخل أو تخرج منه أجسام ولا تؤثر فيه قوى خارجية) تبقى ثابتة.</p>
<div class="formula">E = KE + PE &nbsp;&nbsp;|&nbsp;&nbsp; KE<sub>قبل</sub> + PE<sub>قبل</sub> = KE<sub>بعد</sub> + PE<sub>بعد</sub></div>
<ul class="l"><li>اختيار مستوى الإسناد يغيّر قيمة E لكنها تبقى ثابتة طوال الحركة، والذي يحدد الحركة هو تغيرات الطاقة.</li><li>على سطح مائل أملس: المسار لا يؤثر في الطاقة الحركية النهائية، بل الارتفاع فقط.</li><li>إذا أثّرت قوة خارجية: E قبل + W = E بعد.</li></ul>
<div class="tip"><b>استراتيجية الحل:</b> 1) حدّد النظام وتأكد أنه مغلق. 2) عيّن أشكال الطاقة. 3) حدد الحالتين الابتدائية والنهائية. 4) هل النظام معزول؟ 5) اختر مستوى الإسناد وارسم الأعمدة.</div>
<div class="ex"><b>مثال:</b> غصن 22.0 kg سقط من 13.3 m على سقف ارتفاعه 6.0 m. h = 7.3 m ⟵ KE عند السقف = PE = 22.0×9.80×7.3 ≈ 1.6×10³ J ⟵ v = √(2KE/m) ≈ 12 m/s.</div>`,

s6:{n:'فقدان الطاقة الميكانيكية',icon:'🔥',col:'#dc2626',
goals:['أفسّر لماذا لا تبدو الطاقة محفوظة في حياتنا اليومية.','أحدد أشكال الطاقة التي تتحول إليها الطاقة الميكانيكية المفقودة.','أطبق E قبل + W = E بعد عند وجود قوى خارجية.'],
learn:`<p>في الواقع يتوقف البندول وترتد الكرة إلى ارتفاع أقل. الطاقة لا تختفي، بل يتحول جزء من الطاقة الميكانيكية إلى أشكال أخرى (<b>حرارية وصوتية</b>) بفعل <b>الاحتكاك ومقاومة الهواء</b>، وتزيد الطاقة الحرارية عادة درجة حرارة الجسم.</p>
<div class="formula">E<sub>قبل</sub> + W = E<sub>بعد</sub> &nbsp;⟹&nbsp; طاقة مفقودة = E<sub>قبل</sub> − E<sub>بعد</sub></div>
<div class="ex"><b>مثال:</b> طفل 36.0 kg ينزلق من ارتفاع 2.5 m ويصل أسفل اللعبة بسرعة 3.0 m/s. PE = 36×9.8×2.5 = 882 J، KE = ½×36×3² = 162 J ⟵ الطاقة المفقودة = 882 − 162 = <b>720 J</b> (احتكاك).</div>
<div class="tip">نموذج المال: إن «نقص» مبلغك فستبحث عن مكان صرفه؛ كذلك العلماء حين تنقص الطاقة الميكانيكية يبحثون عن الشكل الجديد الذي تحولت إليه.</div>`,

/* ================== حالة الطالب ================== */
function newStudent(n){return {name:n,cls:'',level:null,pre:null,post:null,points:0,badges:[],done:{},qok:{},acc:{},kwl:{},lab:{},acts:{},tah:{c:0,t:0},log:[],ts:Date.now()}}
function addPts(n,why){const st=me();if(!st||!n)return;st.points+=n;st.log.push({t:Date.now(),n,why});save();toast(`⭐ +${n} نقطة — ${why}`)}
function addBadge(id){const st=me();if(st&&!st.badges.includes(id)){st.badges.push(id);save();toast(`${BADGES[id][0]} شارة جديدة: ${BADGES[id][1]}`)}}
function pathOrder(l){return l==='b'?['s1','s2','s3','s4','s5','s6','s7']:l==='a'?['s5','s7','s6','s3','s2','s1','s4']:['s2','s3','s5','s1','s4','s6','s7']}
function skillProg(st,k){const n=SK[k].qs.length;const c=SK[k].qs.filter(q=>st.qok[q.id]).length;return {c,n,pct:Math.round(c/n*100)}}
function groupOf(name){for(const [cn,c] of Object.entries(DB.classes)){if(c.students.includes(name))return {cls:cn,g:(c.groups&&c.groups[name])||''}}return {cls:'',g:''}}
function rosterNames(){const a=[];Object.entries(DB.classes).forEach(([cn,c])=>c.students.forEach(n=>a.push({n,cn})));return a}

/* ================== التنقل ================== */
function go(v,o){S.view=v;if(o)Object.assign(S,o);render()}
function openSkill(k,tab){S.skill=k;S.tab=tab||'learn';S.view='skill';render()}
function setTab(t){S.tab=t;render(true)}
function logout(){DB.current=null;save();S.view='login';S.quiz=null;render()}
function toggleProj(){document.documentElement.classList.toggle('proj')}

function login(){
 let name=norm($('nm').value);const pick=$('pick')&&$('pick').value;
 if(pick){name=pick}
 else{if(!name){toast('اكتب اسمك');return}
  const f=findRoster(name);
  if(f)name=f;
  else if(rosterNames().length&&!DB.settings.allowOther){toast('الاسم غير موجود في قائمة الفصل — تأكد من كتابته أو اختره من القائمة');return}
  else if(name.split(' ').length<3){toast('الرجاء كتابة الاسم الثلاثي كاملاً');return}}
 if(!DB.students[name])DB.students[name]=newStudent(name);
 const g=groupOf(name);DB.students[name].cls=g.cls;DB.current=name;save();

/* ================== الاختبارات ================== */
function mkItem(q){const idx=shuffle([0,1,2,3]);return {...q,o:idx.map(i=>q.o[i]),a:idx.indexOf(q.a)}}
function startQuiz(mode,key){
 const st=me();let src=[];
 if(mode==='skill'){const tg={b:1,m:2,a:3}[st.level||'m'];src=SK[key].qs.map(q=>({...q,sk:key}));src.sort((x,y)=>Math.abs(x.d-tg)-Math.abs(y.d-tg))}
 else if(mode==='tah'){src=shuffle(TAH.map(q=>({...q,sk:'t'})))}
 else if(mode==='pre'){src=PRE.map(q=>({...q,sk:'p'}))}
 else if(mode==='post'){SKILLS.forEach(k=>shuffle(SK[k].qs).slice(0,2).forEach(q=>src.push({...q,sk:k})));src.push({...shuffle(TAH)[0],sk:'t'});src=shuffle(src)}
 S.quiz={mode,key,items:src.map(mkItem),i:0,sel:null,res:[],hint:false,done:false};S.view='quiz';render()}
function hintOn(){S.quiz.hint=true;render(true)}
function answer(i){
 const Qz=S.quiz,st=me();if(Qz.sel!==null)return;const it=Qz.items[Qz.i];Qz.sel=i;const ok=i===it.a;Qz.res[Qz.i]={id:it.id,ok,sk:it.sk};
 if(ok){S.streak++;if(!st.badges.includes('first')&&Qz.mode!=='pre')addBadge('first');if(S.streak>=5)addBadge('streak')}else S.streak=0;
 if(Qz.mode==='skill'||Qz.mode==='tah'){
  if(it.sk==='t'){st.tah.t++;if(ok)st.tah.c++}else{const a=st.acc[it.sk]||(st.acc[it.sk]={c:0,t:0});a.t++;if(ok)a.c++}
  if(ok&&!st.qok[it.id]){st.qok[it.id]=1;let p=it.d===1?10:it.d===2?15:20;if(Qz.hint)p=Math.ceil(p/2);addPts(p,'إجابة صحيحة');if(it.sk!=='t')checkDone(it.sk)}
 }
 save();render(true)}
function checkDone(k){const st=me();if(st.done[k])return;const p=skillProg(st,k);if(p.c>=Math.ceil(p.n*0.7)){st.done[k]=true;addPts(50,'إتقان مهارة: '+SK[k].n);addBadge('master');if(SKILLS.every(x=>st.done[x]))addBadge('all')}}
function nextQ(){const Qz=S.quiz;if(Qz.i+1>=Qz.items.length){finishQuiz();return}Qz.i++;Qz.sel=null;Qz.hint=false;render()}
function finishQuiz(){
 const Qz=S.quiz,st=me();const c=Qz.res.filter(r=>r&&r.ok).length,n=Qz.items.length;Qz.done=true;Qz.score=c;
 if(Qz.mode==='pre'){const first=!st.pre;st.pre={score:c,total:n,ts:Date.now()};st.level=c<=3?'b':c<=6?'m':'a';if(first)addPts(20,'إكمال الاختبار التشخيصي');if(st.level==='a')addBadge('adv')}
 if(Qz.mode==='post'){const prev=st.post?st.post.score:0;st.post={score:Math.max(prev,c),total:n,last:c,ts:Date.now()};if(c>prev)addPts((c-prev)*5,'تحسن في الاختبار الختامي');if(c/n>=0.8)addBadge('post')}
 save();render()}
function quitQuiz(){S.quiz=null;go(S.skill&&S.view==='quiz'&&S.quizFrom==='skill'?'skill':'home')}

function header(){const st=me();return `<div class="hdr noprint"><div class="hrow"><div class="logo">${logoHTML()}</div><div class="ttl"><b>منصة الطاقة وحفظها — الفصل الخامس</b><small>مدارس الأنجال الأهلية بالأحساء • إشراف أ. محمد عمران</small></div>
${st?`<span class="chip">👤 ${esc(st.name.split(' ').slice(0,2).join(' '))}</span><span class="chip">⭐ ${st.points}</span>${st.level?`<span class="chip">${LV[st.level]}</span>`:''}<button class="btn s w" onclick="go('home')">🏠</button><button class="btn s w" onclick="go('board')">🏅 لوحة الشرف</button><button class="btn s w" onclick="go('report')">📊 تقريري</button>`:''}
<button class="btn s w" onclick="toggleProj()" title="وضع العرض على السبورة">🖥️ عرض</button><button class="btn s w" onclick="go('teacher')">🎓 المعلم</button>${st?`<button class="btn s w" onclick="logout()">خروج</button>`:''}</div></div>`}
function footer(){return `<div class="wrap noprint" style="text-align:center;color:#64748b;font-size:.85rem">إعداد وإشراف: أ. محمد عمران — مدارس الأنجال الأهلية بالأحساء • المحتوى مبني على كتاب الفيزياء (الفصل الخامس: الطاقة وحفظها)</div>`}
function render(keep){stopAnim();const y=window.scrollY;let b='';const needLogin=['home','skill','quiz','tahsili','post','board','report','preintro'];
 if(needLogin.includes(S.view)&&!me()){S.view='login'}
 switch(S.view){case 'login':b=vLogin();break;case 'preintro':b=vPreIntro();break;case 'home':b=vHome();break;case 'skill':b=vSkill();break;case 'quiz':b=vQuiz();break;case 'board':b=vBoard();break;case 'report':b=vReport();break;case 'teacher':b=vTeacher();break;default:b=vLogin()}
 $('app').innerHTML=header()+`<main class="wrap">${b}</main>`+footer();
 if(S.view==='skill'&&S.tab==='media'&&ANIMS[S.skill])ANIMS[S.skill].init();
 window.scrollTo(0,keep?y:0)}
function vLogin(){const rn=rosterNames();return `<div class="card" style="max-width:640px;margin:1.5rem auto"><div style="text-align:center"><div class="logo" style="width:90px;height:90px;margin:auto">${logoHTML()}</div><h2>مرحباً بك في منصة «الطاقة وحفظها»</h2><p style="color:#475569">رحلة تعلم تفاعلية: تشخيص مستواك ⟵ مسار مخصص ⟵ تدريب ⟵ اختبار ختامي، وتجمع النقاط وتنافس في لوحة الشرف.</p></div>
<label style="font-weight:700">اكتب اسمك (سيظهر لك في القائمة أثناء الكتابة)</label><input type="text" id="nm" list="rl" autocomplete="off" placeholder="مثال: علي حسين العبيدان" onkeydown="if(event.key==='Enter')login()"><datalist id="rl">${rn.map(r=>`<option value="${esc(r.n)}">`).join('')}</datalist>
${rn.length?`<label style="font-weight:700;display:block;margin-top:.7rem">أو اختر اسمك من قائمة الفصل (للجهاز المشترك)</label><select id="pick" onchange="if(this.value)login()"><option value="">— اختر —</option>${rn.map(r=>`<option value="${esc(r.n)}">${esc(r.n)} — ${esc(r.cn)}</option>`).join('')}</select>`:''}
<button class="btn g" style="margin-top:1rem;width:100%;justify-content:center;font-size:1.1rem" onclick="login()">ابدأ الجلسة التعلمية 🚀</button>
<p class="tip" style="margin-top:1rem">يُحفظ تقدمك تلقائياً في هذا المتصفح. على الجهاز المشترك اكتب الاسم نفسه كل مرة لتتابع من حيث توقفت.</p></div>`}
function vPreIntro(){return `<div class="card" style="max-width:700px;margin:1.5rem auto;text-align:center"><h2>الاختبار التشخيصي (8 أسئلة)</h2><p>سيحدد مستواك (مبتدئ / متوسط / متقدم) لنبني لك مساراً مناسباً. ستظهر لك الإجابة الصحيحة وتفسيرها بعد كل سؤال.</p><button class="btn g" onclick="startQuiz('pre')">ابدأ الاختبار ✍️</button> <button class="btn o" onclick="skipPre()">تخطي (مستوى متوسط)</button></div>`}
function skipPre(){const st=me();st.level='m';st.pre={score:0,total:0,skipped:true};save();go('home')}
function ring(p){const c=2*Math.PI*42,o=c*(1-p/100);return `<svg width="110" height="110" viewBox="0 0 110 110"><circle cx="55" cy="55" r="42" fill="none" stroke="#e2e8f0" stroke-width="12"/><circle cx="55" cy="55" r="42" fill="none" stroke="url(#rg)" stroke-width="12" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${o}" transform="rotate(-90 55 55)"/><defs><linearGradient id="rg"><stop offset="0" stop-color="#0b5ed7"/><stop offset="1" stop-color="#12a150"/></linearGradient></defs><text x="55" y="62" text-anchor="middle" font-size="22" font-weight="800" fill="#083f94">${p}%</text></svg>`}
function cmap(m){return `<div class="cm"><div class="cm-c">${m.c}</div><div class="cm-b">${m.b.map((b,i)=>`<div class="cm-br c${i%4}"><div class="cm-t">${b.t}</div>${b.k.map(k=>`<div class="cm-k">${k}</div>`).join('')}</div>`).join('')}</div></div>`}
const MAIN_MAP={c:'الطاقة وحفظها',b:[{t:'الطاقة الحركية',k:['KE = ½mv²','خطية ودورانية']},{t:'طاقة الوضع',k:['جاذبية: mgh','مرونية','سكونية: mc²']},{t:'الطاقة الميكانيكية',k:['E = KE + PE','قانون الحفظ']},{t:'التصادمات',k:['مرن','عديم المرونة','فوق مرن']}]};
function vHome(){const st=me(),done=SKILLS.filter(k=>st.done[k]).length,pct=Math.round(done/7*100),order=pathOrder(st.level||'m'),next=order.find(k=>!st.done[k]);
 const tahOpen=true,postOpen=done>=4||DB.settings.openPost;
 return `<div class="hero"><div>${ring(pct)}</div><div style="flex:1;min-width:220px"><h2 style="margin:0">أهلاً ${esc(st.name.split(' ').slice(0,2).join(' '))} 👋</h2><div>مستواك: <span class="tag g">${LV[st.level||'m']}</span> &nbsp; مهارات متقنة: <b>${done}/7</b> &nbsp; نقاطك: <b>${st.points}</b></div>
<div style="margin-top:.5rem">${next?`<button class="btn g" onclick="openSkill('${next}')">متابعة: ${SK[next].icon} ${SK[next].n}</button>`:`<span class="tag g">🎉 أتممت جميع المهارات — جرّب الاختبار الختامي!</span>`}</div></div>
<div class="card" style="min-width:230px"><b>شاراتي</b><div>${Object.entries(BADGES).map(([k,v])=>`<div class="badge ${st.badges.includes(k)?'':'off'}"><span>${v[0]}</span>${v[1]}</div>`).join('')}</div></div></div>
<h2 style="margin-top:1rem">مسارك التعليمي المخصص (${LV[st.level||'m']})</h2>
<p style="color:#475569">${st.level==='b'?'تبدأ بالأساسيات خطوة بخطوة مع تلميحات وأسئلة أسهل أولاً.':st.level==='a'?'مسارك يبدأ بالتحديات وتطبيقات الحفظ والتصادمات، وأسئلتك الأصعب أولاً.':'مسارك متوازن: أسئلة متوسطة الصعوبة أولاً ثم الأصعب.'}</p>
<div class="grid g3">${order.map((k,i)=>{const p=skillProg(st,k),s=SK[k];return `<div class="card sk ${k===next?'next':''}" onclick="openSkill('${k}')"><div style="display:flex;justify-content:space-between"><span class="ic">${s.icon}</span><span class="tag ${st.done[k]?'g':k===next?'y':''}">${st.done[k]?'✓ متقنة':k===next?'التالية لك':'المهارة '+(i+1)}</span></div><h3>${s.n}</h3><div class="bar"><i style="width:${p.pct}%"></i></div><small>${p.c} من ${p.n} أسئلة صحيحة</small></div>`}).join('')}</div>
<div class="grid g3" style="margin-top:1rem">
<div class="card"><h3>🎯 أسئلة تحصيلي</h3><p>${TAH.length} سؤالاً مكثفاً بإجابات نموذجية وتفسير.</p><button class="btn" onclick="S.skill=null;startQuiz('tah')">ابدأ التدريب</button></div>
<div class="card"><h3>🏁 الاختبار الختامي</h3><p>15 سؤالاً شاملاً. ${postOpen?'':'يُفتح بعد إتقان 4 مهارات.'} ${st.post?`أفضل نتيجة: <b>${st.post.score}/${st.post.total}</b>`:''}</p><button class="btn g" ${postOpen?'':'disabled'} onclick="S.skill=null;startQuiz('post')">ابدأ الاختبار</button></div>
<div class="card"><h3>🗺️ خريطة الفصل</h3><button class="btn o" onclick="go('map')">عرض الخريطة</button></div></div>`}
function vSkill(){const k=S.skill,s=SK[k],st=me(),T=[['learn','📘 الشرح'],['media','🎬 فيديو ورسوم'],['lab','🧪 تجربة افتراضية'],['acts','👥 أنشطة الحصة'],['map','🗺️ خريطة المفاهيم'],['kwl','📝 جدول KWL'],['practice','✍️ تدريب']];
 let b='';
 if(S.tab==='learn')b=`<div class="grid g2"><div class="card"><h3>🎯 أهداف التعلم</h3><ul class="l">${s.goals.map(g=>`<li>${g}</li>`).join('')}</ul>${st.level==='b'?'<div class="tip">💡 نصيحة لمستواك: اقرأ الشرح ثم شاهد الرسم المتحرك قبل حل الأسئلة، واستعمل زر «تلميح».</div>':st.level==='a'?'<div class="tip">🚀 نصيحة لمستواك: ابدأ بأسئلة التدريب مباشرة، ثم عد للشرح عند الحاجة.</div>':''}</div><div class="card">${s.learn}</div></div>`;
 if(S.tab==='media')b=`<div class="card"><h3>🎬 فيديوهات مقترحة</h3><div class="grid g2">${s.vids.map(v=>v.id?`<iframe class="phet" style="height:260px" src="https://www.youtube.com/embed/${v.id}" allowfullscreen></iframe>`:`<a class="btn o" target="_blank" rel="noopener" href="https://www.youtube.com/results?search_query=${encodeURIComponent(v.q)}">▶ ${v.t}</a>`).join('')}</div></div><div class="card" style="margin-top:1rem"><h3>🎞️ رسم متحرك تفاعلي</h3><div class="anim" id="animBox">${ANIMS[k].html()}</div></div>`;
 if(S.tab==='lab')b=`<div class="card"><h3>🧪 التجربة الافتراضية (PhET)</h3>${s.phet.map(p=>`<div style="margin:.4rem 0"><a class="btn g" target="_blank" rel="noopener" href="https://phet.colorado.edu/ar/simulations/${p.s}">${p.n} ↗</a> <button class="btn s o" onclick="loadPhet('${p.s}')">تشغيل داخل المنصة</button></div>`).join('')}<div id="phetbox"></div>
 <h3>خطوات التجربة</h3><ol class="l" style="list-style:decimal">${s.lab.steps.map(x=>`<li>${x}</li>`).join('')}</ol><h3>أسئلة التحليل</h3><ul class="l">${s.lab.qs.map(x=>`<li>${x}</li>`).join('')}</ul><textarea id="labtxt" rows="4" placeholder="اكتب ملاحظاتك ونتائجك هنا...">${esc(st.lab[k]||'')}</textarea><button class="btn" style="margin-top:.5rem" onclick="saveLab('${k}')">حفظ ملاحظاتي</button></div>`;
 if(S.tab==='acts'){const L=[['hook','🔥 نشاط التهيئة','a0'],['explore','🔍 نشاط الاستكشاف','a1'],['enrich','🌱 نشاط الإثراء','a2'],['ext','🚀 نشاط التوسع','a3']];
  b=`<div class="tip">أنشطة صفية مقدَّرة بالزمن يمكن تنفيذها في الحصة (45 دقيقة): تهيئة + استكشاف + إثراء أو توسع. استخدم زر المؤقت لضبط وقت كل نشاط.</div>`+L.map(([id,tt,c])=>{const a=s.acts[id],done=st.acts[k+id];return `<div class="act ${c}"><div style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:.4rem"><h3 style="margin:0">${tt}: ${a.t}</h3><span><span class="tag y">⏱ ${a.min} دقيقة</span> <button class="btn s" onclick="startTimer(${a.min},'${a.t.replace(/'/g,'')}')">ابدأ المؤقت</button></span></div><p><b>الأدوات:</b> ${a.mat}</p><ol>${a.steps.map(x=>`<li>${x}</li>`).join('')}</ol><div class="tip"><b>سؤال للنقاش:</b> ${a.q}</div><button class="btn s ${done?'':'g'}" onclick="markAct('${k}','${id}')" ${done?'disabled':''}>${done?'✓ تم التنفيذ':'تم تنفيذ النشاط (+5)'}</button></div>`}).join('')}
 if(S.tab==='map')b=`<div class="card">${cmap(s.map)}</div>`;
 if(S.tab==='kwl'){const v=st.kwl[k]||{k:'',w:'',l:''};b=`<div class="card"><h3>📝 جدول التعلم الذاتي — ${s.n}</h3><div class="grid g3"><div><b style="color:#0b5ed7">ماذا أعرف؟ (K)</b><textarea id="kw_k" rows="6">${esc(v.k)}</textarea></div><div><b style="color:#d97706">ماذا أريد أن أعرف؟ (W)</b><textarea id="kw_w" rows="6">${esc(v.w)}</textarea></div><div><b style="color:#12a150">ماذا تعلمت؟ (L)</b><textarea id="kw_l" rows="6">${esc(v.l)}</textarea></div></div><button class="btn g" style="margin-top:.6rem" onclick="saveKWL('${k}')">حفظ الجدول (+15 عند اكتماله)</button></div>`}
 if(S.tab==='practice'){const p=skillProg(st,k),a=st.acc[k]||{c:0,t:0};b=`<div class="card"><h3>✍️ بنك أسئلة المهارة (${s.qs.length} أسئلة)</h3><div class="bar"><i style="width:${p.pct}%"></i></div><p>الأسئلة التي أجبتها صحيحاً: <b>${p.c}/${p.n}</b> &nbsp; الدقة الكلية: <b>${a.t?Math.round(a.c/a.t*100):0}%</b> &nbsp; ${st.done[k]?'<span class="tag g">✓ مهارة متقنة</span>':'<span class="tag y">تحتاج 70% لإتقانها (+50 نقطة)</span>'}</p><p>الترتيب مخصص لمستواك (${LV[st.level||'m']}).</p><button class="btn g" onclick="S.quizFrom='skill';startQuiz('skill','${k}')">ابدأ التدريب</button></div>`}
 return `<button class="btn s o" onclick="go('home')">⟵ رجوع</button><h2 style="margin-top:.6rem">${s.icon} ${s.n}</h2><div class="tabs noprint">${T.map(t=>`<button class="tab ${S.tab===t[0]?'on':''}" onclick="setTab('${t[0]}')">${t[1]}</button>`).join('')}</div>${b}`}
function vQuiz(){const Qz=S.quiz;if(!Qz){S.view='home';return vHome()}const titles={pre:'الاختبار التشخيصي',post:'الاختبار الختامي',tah:'أسئلة تحصيلي',skill:'تدريب: '+(SK[Qz.key]?SK[Qz.key].n:'')};
 if(Qz.done){const n=Qz.items.length,c=Qz.score,p=Math.round(c/n*100),st=me();return `<div class="card" style="max-width:700px;margin:1rem auto;text-align:center"><h2>${titles[Qz.mode]} — النتيجة</h2><div style="font-size:3rem">${p>=80?'🏆':p>=50?'👍':'💪'}</div><h2>${c} / ${n} (${p}%)</h2>${Qz.mode==='pre'?`<p>مستواك: <span class="tag g">${LV[st.level]}</span> — تم تخصيص مسارك.</p>`:''}${Qz.mode==='post'&&p>=80?'<p class="tag g">ممتاز! يمكنك طباعة شهادة من صفحة تقريري.</p>':''}
 <div class="grid g3" style="text-align:right">${Qz.items.map((it,i)=>`<div class="tip" style="margin:0;border-color:${Qz.res[i]&&Qz.res[i].ok?'#16a34a':'#dc2626'}">${Qz.res[i]&&Qz.res[i].ok?'✅':'❌'} ${i+1}. ${it.q.slice(0,60)}…</div>`).join('')}</div>
 <p style="margin-top:1rem"><button class="btn g" onclick="S.quiz=null;go('${S.skill&&Qz.mode==='skill'?'skill':'home'}')">متابعة</button> <button class="btn o" onclick="go('report')">تقريري</button></p></div>`}
 const it=Qz.items[Qz.i],ans=Qz.sel!==null,ok=ans&&Qz.sel===it.a,st=me();
 return `<div class="card" style="max-width:820px;margin:1rem auto"><div style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:.4rem"><b>${titles[Qz.mode]}</b><span class="tag">السؤال ${Qz.i+1} من ${Qz.items.length}</span><span class="tag y">${'⭐'.repeat(it.d)}</span></div><div class="bar" style="margin:.5rem 0"><i style="width:${Qz.i/Qz.items.length*100}%"></i></div>
 <h3 style="font-size:1.2rem">${it.q}</h3>${it.o.map((o,i)=>`<button class="opt ${ans?(i===it.a?'ok':i===Qz.sel?'no':''):''}" ${ans?'disabled':''} onclick="answer(${i})">${['أ','ب','ج','د'][i]}) ${o}</button>`).join('')}
 ${!ans&&it.h&&Qz.mode!=='pre'&&Qz.mode!=='post'&&st.level!=='a'?(Qz.hint?`<div class="tip">💡 ${it.h}</div>`:`<button class="btn s o" onclick="hintOn()">💡 تلميح (يقلل النقاط للنصف)</button>`):''}
 ${ans?`<div class="fb ${ok?'ok':'no'}"><b>${ok?'✅ إجابة صحيحة! أحسنت':'❌ إجابة غير صحيحة'}</b>${ok?'':`<br>الإجابة الصحيحة: <b>${it.o[it.a]}</b>`}<br>${it.e}</div><button class="btn g" style="margin-top:.7rem" onclick="nextQ()">${Qz.i+1>=Qz.items.length?'عرض النتيجة':'السؤال التالي ⟵'}</button>`:''}
 <div style="margin-top:.8rem"><button class="btn s o" onclick="S.quiz=null;go('${S.skill&&Qz.mode==='skill'?'skill':'home'}')">إنهاء</button></div></div>`}
function vMap(){return `<button class="btn s o" onclick="go('home')">⟵ رجوع</button><div class="card" style="margin-top:.6rem"><h2>🗺️ خريطة مفاهيم الفصل</h2>${cmap(MAIN_MAP)}</div>`}
function vBoard(){const st=me();let rows=Object.values(DB.students).map(s=>({n:s.name,p:s.points,c:groupOf(s.name).cls,g:groupOf(s.name).g}));const cl=S.fcls;if(cl)rows=rows.filter(r=>r.c===cl);rows.sort((a,b)=>b.p-a.p);
 const classes=Object.keys(DB.classes);let grp='';
 if(S.boardTab==='grp'){const m={};Object.values(DB.students).forEach(s=>{const g=groupOf(s.name);if(g.g&&(!cl||g.cls===cl)){const k=g.cls+' • مجموعة '+g.g;(m[k]=m[k]||{n:k,t:0,c:0}).t+=s.points;m[k].c++}});
  grp=Object.values(m).sort((a,b)=>b.t-a.t).map((r,i)=>`<tr><td>${['🥇','🥈','🥉'][i]||i+1}</td><td>${esc(r.n)}</td><td>${r.c}</td><td>${r.t}</td><td>${Math.round(r.t/r.c)}</td></tr>`).join('')||'<tr><td colspan="5">لا توجد مجموعات بعد — يضيفها المعلم من لوحة المعلم.</td></tr>'}
 return `<h2>🏅 لوحة الشرف</h2><div class="tabs"><button class="tab ${S.boardTab==='ind'?'on':''}" onclick="S.boardTab='ind';render(true)">الأفراد</button><button class="tab ${S.boardTab==='grp'?'on':''}" onclick="S.boardTab='grp';render(true)">المجموعات</button></div>
 <select onchange="S.fcls=this.value;render(true)" style="max-width:300px;margin-bottom:.6rem"><option value="">كل الشعب</option>${classes.map(c=>`<option ${c===cl?'selected':''}>${esc(c)}</option>`).join('')}</select>
 <div class="card">${S.boardTab==='ind'?`<table class="t"><tr><th>الترتيب</th><th>الطالب</th><th>الشعبة</th><th>المجموعة</th><th>النقاط</th></tr>${rows.slice(0,20).map((r,i)=>`<tr style="${r.n===st.name?'background:#dcfce7;font-weight:800':''}"><td class="med">${['🥇','🥈','🥉'][i]||i+1}</td><td>${esc(r.n)}</td><td>${esc(r.c||'—')}</td><td>${r.g||'—'}</td><td>${r.p}</td></tr>`).join('')}</table>`:`<table class="t"><tr><th>الترتيب</th><th>المجموعة</th><th>عدد الطلاب</th><th>المجموع</th><th>المتوسط</th></tr>${grp}</table>`}
 <p class="tip">تعرض اللوحة طلاب هذا الجهاز/المتصفح. لدمج نتائج أجهزة متعددة يستورد المعلم ملفات النتائج من لوحة المعلم.</p></div>`}
function vReport(){const st=me();const p=st.post;const cert=p&&p.score/p.total>=0.8;
 return `<h2>📊 تقريري التعليمي</h2><div class="grid g4"><div class="card"><small>النقاط</small><h2>${st.points}</h2></div><div class="card"><small>المستوى</small><h2>${LV[st.level]||'—'}</h2></div><div class="card"><small>القبلي</small><h2>${st.pre&&st.pre.total?st.pre.score+'/'+st.pre.total:'—'}</h2></div><div class="card"><small>الختامي (الأفضل)</small><h2>${p?p.score+'/'+p.total:'—'}</h2></div></div>
 <div class="card" style="margin-top:1rem"><h3>الدقة في كل مهارة</h3>${SKILLS.map(k=>{const a=st.acc[k]||{c:0,t:0},pc=a.t?Math.round(a.c/a.t*100):0;return `<div style="margin:.5rem 0"><div style="display:flex;justify-content:space-between"><span>${SK[k].icon} ${SK[k].n}</span><b>${a.t?pc+'%':'—'} ${st.done[k]?'✓':''}</b></div><div class="bar"><i style="width:${pc}%"></i></div></div>`}).join('')}
 <div class="tip"><b>توصية:</b> ${(()=>{const w=SKILLS.filter(k=>st.acc[k]&&st.acc[k].t>=3&&st.acc[k].c/st.acc[k].t<0.6).map(k=>SK[k].n);return w.length?'راجع: '+w.join('، '):'استمر! لا توجد مهارات ضعيفة ظاهرة حالياً.'})()}</div></div>
 <div class="card noprint" style="margin-top:1rem"><button class="btn" onclick="mailMe()">✉️ أرسل نتيجتي للمعلم</button> <button class="btn g" onclick="window.print()">🖨️ طباعة التقرير</button></div>
 ${cert?`<div class="card" style="margin-top:1rem;text-align:center;border:4px double #12a150"><h2>شهادة تقدير</h2><p>تشهد مدارس الأنجال الأهلية بالأحساء بأن الطالب</p><h2>${esc(st.name)}</h2><p>اجتاز الاختبار الختامي لفصل «الطاقة وحفظها» بنسبة ${Math.round(p.score/p.total*100)}%</p><p>معلم المادة: أ. محمد عمران</p></div>`:''}`}

/* ================== لوحة المعلم ================== */
let TROWS=[];
function rowOf(n,cn,g){const s=DB.students[n];return {n,cls:cn,g:g||'',in:!!s,pts:s?s.points:0,lvl:s&&s.level?LV[s.level]:'—',pre:s&&s.pre&&s.pre.total?s.pre.score+'/'+s.pre.total:'—',post:s&&s.post?s.post.score+'/'+s.post.total:'—',sk:s?SKILLS.filter(k=>s.done[k]).length:0}}
function allRows(cls){const rows=[],seen=new Set();Object.entries(DB.classes).forEach(([cn,c])=>{if(cls&&cn!==cls)return;c.students.forEach(n=>{seen.add(n);rows.push(rowOf(n,cn,c.groups&&c.groups[n]))})});if(!cls)Object.keys(DB.students).forEach(n=>{if(!seen.has(n))rows.push(rowOf(n,'',''))});return rows}
function tpin(){const p=$('pin').value;if(p===DB.settings.pin){S.tAuth=true;render()}else toast('الرمز غير صحيح')}
function vTeacher(){
 if(!S.tAuth)return `<div class="card" style="max-width:420px;margin:1.5rem auto;text-align:center"><h2>🎓 لوحة المعلم</h2><p>أدخل رمز المعلم (الافتراضي 1234 — غيّره من الإعدادات)</p><input type="password" id="pin" onkeydown="if(event.key==='Enter')tpin()"><button class="btn g" style="margin-top:.6rem" onclick="tpin()">دخول</button></div>`;
 const T=[['dash','📊 النتائج'],['roster','👥 قوائم الطلاب'],['tools','🛠️ أدوات الحصة'],['set','⚙️ إعدادات']];let b='';
 if(S.tTab==='dash'){TROWS=allRows(S.fcls);const classes=Object.keys(DB.classes);const gm={};TROWS.forEach(r=>{if(r.g){const k=r.cls+'|'+r.g;(gm[k]=gm[k]||{c:r.cls,g:r.g,n:0,t:0,sk:0})}});TROWS.forEach(r=>{if(r.g){const o=gm[r.cls+'|'+r.g];o.n++;o.t+=r.pts;o.sk+=r.sk}});
  b=`<div class="card"><select onchange="S.fcls=this.value;render(true)" style="max-width:300px"><option value="">كل الشعب</option>${classes.map(c=>`<option ${c===S.fcls?'selected':''}>${esc(c)}</option>`).join('')}</select>
  <div style="margin:.6rem 0;display:flex;gap:.4rem;flex-wrap:wrap"><button class="btn s" onclick="mailAll()">✉️ إرسال النتائج إلى بريدي</button><button class="btn s g" onclick="exportCSV()">⬇️ CSV (Excel)</button><button class="btn s o" onclick="exportJSON()">⬇️ نسخة JSON</button><label class="btn s o" style="cursor:pointer">⬆️ استيراد JSON<input type="file" accept=".json" style="display:none" onchange="importJSON(this)"></label><button class="btn s o" onclick="window.print()">🖨️ طباعة</button></div>
  <table class="t"><tr><th>الطالب</th><th>الشعبة</th><th>مجموعة</th><th>المستوى</th><th>قبلي</th><th>ختامي</th><th>مهارات</th><th>نقاط</th></tr>${TROWS.sort((a,b)=>b.pts-a.pts).map(r=>`<tr style="${r.in?'':'color:#94a3b8'}"><td>${esc(r.n)}</td><td>${esc(r.cls||'—')}</td><td>${r.g||'—'}</td><td>${r.lvl}</td><td>${r.pre}</td><td>${r.post}</td><td>${r.sk}/7</td><td>${r.pts}</td></tr>`).join('')||'<tr><td colspan="8">لا توجد بيانات</td></tr>'}</table></div>
  <div class="card" style="margin-top:1rem"><h3>نتائج المجموعات</h3><table class="t"><tr><th>الشعبة</th><th>المجموعة</th><th>عدد الأعضاء</th><th>مجموع النقاط</th><th>المتوسط</th></tr>${Object.values(gm).sort((a,b)=>b.t-a.t).map(o=>`<tr><td>${esc(o.c)}</td><td>${o.g}</td><td>${o.n}</td><td>${o.t}</td><td>${Math.round(o.t/o.n)}</td></tr>`).join('')||'<tr><td colspan="5">أضف مجموعات من تبويب القوائم</td></tr>'}</table></div>`}
 if(S.tTab==='roster'){const cls=Object.entries(DB.classes);b=`<div class="card"><h3>إضافة شعبة / قائمة طلاب</h3><input type="text" id="cn" placeholder="اسم الشعبة (مثال: ثاني ثانوي/3)"><textarea id="cl" rows="6" style="margin-top:.5rem" placeholder="الصق أسماء الطلاب (اسم في كل سطر)"></textarea><button class="btn g" style="margin-top:.5rem" onclick="addClass()">حفظ القائمة</button></div>
  ${cls.map(([cn,c],ci)=>`<div class="card" style="margin-top:1rem"><div style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:.4rem"><h3>${esc(cn)} (${c.students.length})</h3><span><input type="number" id="ng${ci}" min="2" max="10" value="4" style="width:70px;display:inline-block"> <button class="btn s" onclick="autoGroups(${ci})">توزيع تلقائي لمجموعات</button> <button class="btn s r" onclick="delClass(${ci})">حذف</button></span></div><div class="grid g4">${c.students.map((n,si)=>`<div style="display:flex;gap:.3rem;align-items:center"><span style="flex:1;font-size:.85rem">${esc(n)}</span><input type="number" min="0" style="width:54px;padding:.2rem" value="${(c.groups&&c.groups[n])||''}" onchange="setGroup(${ci},${si},this.value)" title="رقم المجموعة"></div>`).join('')}</div></div>`).join('')}`}
 if(S.tTab==='tools'){const rn=rosterNames();b=`<div class="grid g2"><div class="card"><h3>⏱️ مؤقت الحصة</h3><input type="number" id="tm" value="5" min="1"><button class="btn" style="margin-top:.4rem" onclick="startTimer(+$('tm').value,'مؤقت الحصة')">ابدأ</button></div>
 <div class="card"><h3>🎲 اختيار طالب عشوائي</h3><select id="rc"><option value="">كل الشعب</option>${Object.keys(DB.classes).map(c=>`<option>${esc(c)}</option>`).join('')}</select><button class="btn g" style="margin-top:.4rem" onclick="randPick()">اختر</button><div id="rp" class="tip" style="font-size:1.3rem;text-align:center"></div></div>
 <div class="card"><h3>⭐ منح نقاط مشاركة</h3><select id="aw">${rn.map(r=>`<option value="s|${esc(r.n)}">${esc(r.n)}</option>`).join('')}${Object.entries(DB.classes).map(([cn,c])=>[...new Set(Object.values(c.groups||{}))].sort((a,b)=>a-b).map(g=>`<option value="g|${esc(cn)}|${g}">مجموعة ${g} — ${esc(cn)}</option>`).join('')).join('')}</select><input type="number" id="ap" value="5" style="margin-top:.4rem"><input type="text" id="ar" placeholder="السبب (مشاركة، إجابة متميزة...)" style="margin-top:.4rem"><button class="btn" style="margin-top:.4rem" onclick="award()">منح</button><p class="tip">الطالب الذي لم يسجّل دخولاً ستُنشأ له بطاقة تلقائياً.</p></div>
 <div class="card"><h3>📽️ سؤال على السبورة</h3><select id="pq_s">${SKILLS.map(k=>`<option value="${k}">${SK[k].n}</option>`).join('')}<option value="t">تحصيلي</option></select><input type="number" id="pq_i" value="1" min="1" style="margin-top:.4rem"><button class="btn g" style="margin-top:.4rem" onclick="projQ()">اعرض السؤال</button></div>
 <div class="card"><h3>🔓 الاختبار الختامي</h3><label><input type="checkbox" ${DB.settings.openPost?'checked':''} onchange="DB.settings.openPost=this.checked;save()"> فتحه لجميع الطلاب فوراً</label></div></div>`}
 if(S.tTab==='set')b=`<div class="grid g2"><div class="card"><h3>بريد المعلم</h3><input type="text" id="se" value="${esc(DB.settings.email)}"><h3>رمز الدخول</h3><input type="text" id="sp" value="${esc(DB.settings.pin)}"><label style="display:block;margin-top:.6rem"><input type="checkbox" id="sa" ${DB.settings.allowOther?'checked':''}> السماح بالدخول بأسماء غير موجودة في القوائم</label><button class="btn g" style="margin-top:.5rem" onclick="saveSet()">حفظ</button></div>
 <div class="card"><h3>شعار المدرسة</h3><input type="file" accept="image/*" onchange="upLogo(this)"><button class="btn s o" style="margin-top:.5rem" onclick="DB.settings.logo='';save();render(true)">إزالة الشعار</button></div>
 <div class="card"><h3>⚠️ إعادة ضبط</h3><button class="btn r" onclick="if(confirm('سيتم حذف كل بيانات الطلاب والقوائم من هذا المتصفح. متأكد؟')){localStorage.removeItem(LS);DB=loadDB();ensureRoster();S.tAuth=false;go('login')}">حذف جميع البيانات</button></div></div>`;
 return `<h2>🎓 لوحة المعلم — أ. محمد عمران</h2><div class="tabs">${T.map(t=>`<button class="tab ${S.tTab===t[0]?'on':''}" onclick="S.tTab='${t[0]}';render(true)">${t[1]}</button>`).join('')}<button class="tab" onclick="S.tAuth=false;go('login')">🔒 خروج</button></div>${b}`}
function addClass(){const cn=norm($('cn').value),names=$('cl').value.split('\n').map(norm).filter(Boolean);if(!cn||!names.length){toast('أدخل الشعبة والأسماء');return}const old=DB.classes[cn]||{students:[],groups:{}};names.forEach(n=>{if(!old.students.includes(n))old.students.push(n)});DB.classes[cn]=old;save();toast('تم حفظ القائمة ✓');render(true)}
function delClass(i){const k=Object.keys(DB.classes)[i];if(confirm('حذف الشعبة '+k+'؟')){delete DB.classes[k];save();render(true)}}
function setGroup(ci,si,v){const c=Object.values(DB.classes)[ci];c.groups=c.groups||{};const n=c.students[si];if(v)c.groups[n]=parseInt(v);else delete c.groups[n];save()}
function autoGroups(ci){const c=Object.values(DB.classes)[ci],n=Math.max(2,parseInt($('ng'+ci).value)||4);c.groups={};shuffle(c.students).forEach((s,i)=>c.groups[s]=i%n+1);save();render(true)}
function randPick(){const cn=$('rc').value;let a=rosterNames().filter(r=>!cn||r.cn===cn);if(!a.length){$('rp').textContent='لا توجد قوائم';return}$('rp').textContent='🎯 '+a[Math.floor(Math.random()*a.length)].n}
function award(){const v=$('aw').value.split('|'),p=parseInt($('ap').value)||0,why=$('ar').value||'مشاركة صفية';let names=[];if(v[0]==='s')names=[v[1]];else{const c=DB.classes[v[1]];names=c.students.filter(n=>(c.groups||{})[n]==v[2])}
 names.forEach(n=>{if(!DB.students[n])DB.students[n]=newStudent(n);DB.students[n].points+=p;DB.students[n].log.push({t:Date.now(),n:p,why:'المعلم: '+why})});save();toast(`تم منح ${p} نقطة لـ ${names.length} طالب`)}
function projQ(){const k=$('pq_s').value,i=Math.max(1,parseInt($('pq_i').value)||1)-1,list=k==='t'?TAH:SK[k].qs,q=list[Math.min(i,list.length-1)];
 window.PQ=q;$('modal').innerHTML=`<div class="modal" onclick="if(event.target===this)this.remove()"><div class="in"><h2 style="font-size:1.8rem">${q.q}</h2>${q.o.map((o,j)=>`<div class="opt" id="po${j}" style="font-size:1.4rem">${['أ','ب','ج','د'][j]}) ${o}</div>`).join('')}<div id="pa"></div><button class="btn g" onclick="projAns()">إظهار الإجابة</button> <button class="btn r" onclick="document.getElementById('modal').innerHTML=''">إغلاق</button></div></div>`}
function projAns(){const q=window.PQ;$('po'+q.a).classList.add('ok');$('pa').innerHTML='<div class="fb ok">'+q.e+'</div>'}
function saveSet(){DB.settings.email=norm($('se').value);DB.settings.pin=norm($('sp').value)||'1234';DB.settings.allowOther=$('sa').checked;save();toast('تم الحفظ ✓')}
function upLogo(inp){const f=inp.files[0];if(!f)return;if(f.size>400000){toast('الصورة كبيرة، اختر شعاراً أقل من 400KB');return}const r=new FileReader();r.onload=()=>{DB.settings.logo=r.result;save();render(true)};r.readAsDataURL(f)}
function download(name,txt,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([txt],{type}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function exportCSV(){const rows=allRows(S.fcls);let t='\ufeffالاسم,الشعبة,المجموعة,المستوى,القبلي,الختامي,المهارات المتقنة,النقاط\n';rows.forEach(r=>t+=[r.n,r.cls,r.g,r.lvl,r.pre,r.post,r.sk+'/7',r.pts].map(x=>'"'+String(x).replace(/"/g,'""')+'"').join(',')+'\n');download('نتائج_الطاقة_وحفظها.csv',t,'text/csv;charset=utf-8')}
function exportJSON(){download('energy_results_'+new Date().toISOString().slice(0,10)+'.json',JSON.stringify({students:DB.students,classes:DB.classes}),'application/json')}
function importJSON(inp){const f=inp.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);let n=0;Object.entries(d.students||{}).forEach(([k,s])=>{if(!DB.students[k]||(s.points||0)>DB.students[k].points){DB.students[k]=s;n++}});Object.entries(d.classes||{}).forEach(([k,c])=>{if(!DB.classes[k])DB.classes[k]=c;else{c.students.forEach(x=>{if(!DB.classes[k].students.includes(x))DB.classes[k].students.push(x)});DB.classes[k].groups=Object.assign({},c.groups||{},DB.classes[k].groups||{})}});save();toast(`تم دمج ${n} سجل ✓`);render(true)}catch(e){toast('ملف غير صالح')}};r.readAsText(f)}
function sendMail(sub,body){const to=DB.settings.email||'momran1985@gmail.com';if(body.length>1700){try{navigator.clipboard.writeText(body);toast('النص طويل: نُسخ للحافظة، الصقه في الرسالة')}catch(e){}body=body.slice(0,1500)+'\n... (النتيجة الكاملة نُسخت للحافظة أو استخدم CSV)'}location.href='mailto:'+to+'?subject='+encodeURIComponent(sub)+'&body='+encodeURIComponent(body)}
function mailAll(){const rows=allRows(S.fcls).filter(r=>r.in).sort((a,b)=>b.pts-a.pts);const body='نتائج منصة الطاقة وحفظها'+(S.fcls?' — '+S.fcls:'')+'\n\n'+rows.map(r=>`${r.n} | ${r.cls||'-'} | م${r.g||'-'} | ${r.lvl} | قبلي ${r.pre} | ختامي ${r.post} | مهارات ${r.sk}/7 | ${r.pts} نقطة`).join('\n');sendMail('نتائج الطلاب — الطاقة وحفظها',body)}
function mailMe(){const st=me(),body=`الطالب: ${st.name}\nالشعبة: ${st.cls||'-'}\nالمستوى: ${LV[st.level]||'-'}\nالقبلي: ${st.pre&&st.pre.total?st.pre.score+'/'+st.pre.total:'-'}\nالختامي: ${st.post?st.post.score+'/'+st.post.total:'-'}\nالمهارات المتقنة: ${SKILLS.filter(k=>st.done[k]).length}/7\nالنقاط: ${st.points}`;sendMail('نتيجة الطالب '+st.name+' — الطاقة وحفظها',body)}

/* ملاحظة: خريطة الفصل تُعرض بعرض 'map' */
const _render=render;render=function(k){if(S.view==='map'&&me()){stopAnim();$('app').innerHTML=header()+`<main class="wrap">${vMap()}</main>`+footer();window.scrollTo(0,0);return}_render(k)};
render();
</script>
